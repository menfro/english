<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>⚔️ English Quest – Jet 2 Unit 3</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Heebo:wght@400;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html{font-size:16px;}
body{font-family:'Heebo',sans-serif;direction:rtl;background:#08081a;color:#fff;min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;}
.ff{font-family:'Fredoka One',cursive;}
.app-root{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}

/* ── ANIMATIONS ──────────────────── */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
@keyframes screenShake{0%,100%{transform:translate(0,0)}10%{transform:translate(-8px,-4px)}20%{transform:translate(8px,4px)}30%{transform:translate(-6px,3px)}40%{transform:translate(6px,-3px)}50%{transform:translate(-8px,4px)}60%{transform:translate(8px,-4px)}70%{transform:translate(-4px,2px)}80%{transform:translate(4px,-2px)}90%{transform:translate(-6px,4px)}}
@keyframes hitFlash{0%,100%{filter:none; transform:scale(1);}40%{filter:brightness(4) hue-rotate(30deg) saturate(2); transform:scale(0.85);}}
@keyframes bossAngry{0%,100%{filter:none}50%{filter:hue-rotate(25deg) brightness(1.4) saturate(1.8)}}
@keyframes bossEnrage{0%,100%{filter:hue-rotate(0deg) brightness(1)}50%{filter:hue-rotate(15deg) brightness(1.6) saturate(2)}}
@keyframes bossDeath{0%{transform:scale(1) rotate(0);opacity:1}30%{transform:scale(1.5) rotate(-10deg);filter:brightness(4)}70%{transform:scale(0.8) rotate(20deg);opacity:.5}100%{transform:scale(0) rotate(45deg);opacity:0}}
@keyframes gemFly{0%{opacity:1;transform:translate(0,0) scale(1)}100%{opacity:0;transform:translate(var(--gx),var(--gy)) scale(.3)}}
@keyframes dmgNum{0%{opacity:1;transform:translateY(0) scale(1.2)}100%{opacity:0;transform:translateY(-60px) scale(.7)}}
@keyframes comboFlash{0%,100%{opacity:0;transform:scale(.8)}20%,80%{opacity:1;transform:scale(1)}}
@keyframes rainbow{0%{filter:hue-rotate(0deg)}100%{filter:hue-rotate(360deg)}}
@keyframes powerGlow{0%,100%{box-shadow:0 0 8px #f59e0b}50%{box-shadow:0 0 28px #f59e0b,0 0 56px #ef4444}}
@keyframes chestBounce{0%,100%{transform:scale(1) rotate(0)}30%{transform:scale(1.15) rotate(-8deg)}60%{transform:scale(1.1) rotate(6deg)}}
@keyframes cardReveal{0%{transform:translateY(40px) scale(.6) rotate(var(--cr));opacity:0}100%{transform:translateY(0) scale(1) rotate(0);opacity:1}}
@keyframes goldPulse{0%,100%{box-shadow:0 0 12px #f59e0b44}50%{box-shadow:0 0 40px #f59e0b,0 0 70px #fbbf24}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes streakFire{0%,100%{transform:scale(1) rotate(-5deg)}50%{transform:scale(1.1) rotate(5deg)}}
@keyframes specialWarning{0%,100%{background:rgba(239,68,68,.06)}50%{background:rgba(239,68,68,.22)}}
@keyframes pulseRed{0%,100%{filter:none}50%{filter:brightness(1.2) saturate(1.4) hue-rotate(-20deg)}}
@keyframes superReady{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.22)}100%{transform:scale(1)}}
@keyframes pDash{0%,100%{transform:translateX(0)}50%{transform:translateX(-40px) scale(1.15)}}
@keyframes bDash{0%,100%{transform:translateX(0)}50%{transform:translateX(40px) scale(1.15)}}
@keyframes superFlashAnim{0%{opacity:1;background:#fff;}20%{background:#f59e0b;}100%{opacity:0;background:transparent;}}

.screen{min-height:100vh;display:flex;flex-direction:column;animation:fadeUp .35s ease both;}
.shake-s{animation:screenShake .35s ease!important;}
.shake-h{animation:screenShake .55s ease!important;}
.anim-pop{animation:pop .3s ease;}
.anim-shake{animation:shake .4s ease;}
.pDash{animation:pDash .3s ease forwards;}
.bDash{animation:bDash .3s ease forwards;}
.super-flash{position:fixed;inset:0;background:#fff;z-index:9999;animation:superFlashAnim 1s ease-out forwards;pointer-events:none;}

/* ── BUTTONS ─────────────────────── */
.btn{border:none;cursor:pointer;border-radius:50px;font-family:'Heebo',sans-serif;font-weight:800;transition:all .18s;display:inline-flex;align-items:center;justify-content:center;gap:6px;-webkit-tap-highlight-color:transparent;}
.btn:active{transform:scale(.94)!important;}
.btn-primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;padding:14px 32px;font-size:1.05rem;box-shadow:0 4px 20px rgba(99,102,241,.5);}
.btn-primary:hover{transform:translateY(-2px);}
.btn-danger{background:linear-gradient(135deg,#ef4444,#dc2626);color:#fff;padding:13px 28px;font-size:1rem;box-shadow:0 4px 16px rgba(239,68,68,.4);}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;padding:12px 24px;font-size:.95rem;border:1.5px solid rgba(255,255,255,.2);}
.btn-back{width:40px;height:40px;border:none;border-radius:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:1.15rem;transition:transform .15s;flex-shrink:0;background:rgba(255,255,255,.1);color:#fff;}
.btn-back:hover{transform:scale(1.1);}

/* ── HUD ─────────────────────────── */
.hud{display:flex;align-items:center;gap:8px;padding:10px 14px;background:rgba(0,0,0,.55);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.07);position:sticky;top:0;z-index:50;}
.heart{font-size:1.25rem;transition:all .3s;line-height:1;}
.heart.lost{opacity:.2;filter:grayscale(1);transform:scale(.8);}
.gems-hud{background:rgba(255,255,255,.08);border-radius:50px;padding:5px 12px;font-weight:900;font-size:.9rem;display:flex;align-items:center;gap:4px;}

/* ── COMBO ───────────────────────── */
.combo-badge{padding:4px 12px;border-radius:50px;font-weight:900;font-size:.82rem;white-space:nowrap;}
.combo-2{background:linear-gradient(135deg,#f59e0b,#f97316);box-shadow:0 0 12px rgba(245,158,11,.5);}
.combo-5{background:linear-gradient(135deg,#ef4444,#dc2626);box-shadow:0 0 20px rgba(239,68,68,.7);animation:powerGlow .6s ease infinite;}
.combo-10{background:linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b);box-shadow:0 0 30px rgba(139,92,246,.8);animation:rainbow 1.2s linear infinite;}

/* ── POWER BAR ───────────────────── */
.power-bar-wrap{padding:8px 16px;display:flex;align-items:center;gap:10px;background:rgba(0,0,0,.3);}
.power-segments{display:flex;gap:4px;flex:1;}
.power-seg{flex:1;height:10px;border-radius:5px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.1);transition:all .3s;}
.power-seg.lit{background:linear-gradient(90deg,#f59e0b,#ef4444);box-shadow:0 0 8px rgba(245,158,11,.6);}
.super-btn{padding:8px 16px;border-radius:14px;border:2px solid rgba(245,158,11,.7);background:rgba(245,158,11,.15);font-family:'Heebo',sans-serif;font-weight:900;font-size:.82rem;cursor:pointer;color:#f59e0b;transition:all .2s;white-space:nowrap;}
.super-btn.ready{animation:superReady 1s ease infinite;border-color:#f59e0b;background:rgba(245,158,11,.25);box-shadow:0 0 20px rgba(245,158,11,.4);}
.super-btn:disabled{opacity:.3;cursor:default;animation:none;}

/* ── POTION BAR ──────────────────── */
.potion-bar{display:flex;gap:8px;padding:6px 14px;background:rgba(0,0,0,.25);}
.pot-btn{flex:1;padding:7px 6px;border-radius:12px;border:1.5px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);cursor:pointer;font-family:'Heebo',sans-serif;font-weight:800;font-size:.75rem;color:#fff;text-align:center;transition:all .15s;}
.pot-btn:hover:not(:disabled){border-color:#a78bfa;background:rgba(167,139,250,.15);}
.pot-btn:disabled{opacity:.3;cursor:default;}

/* ── QUESTION CARD ───────────────── */
.q-card{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);border-radius:26px;padding:24px;text-align:center;margin:10px 14px;transition:all 0.3s ease;}
.q-card.golden{border-width:3px;border-color:#f59e0b;background:rgba(245,158,11,.15);animation:goldPulse 1.5s ease infinite;transform:scale(1.02);}
.q-emoji{font-size:3rem;margin-bottom:8px;}
.q-he{font-weight:900;font-size:1.65rem;line-height:1.2;}
.gold-badge{display:inline-flex;align-items:center;gap:6px;background:linear-gradient(135deg,#f59e0b,#fbbf24);color:#78350f;border-radius:50px;padding:5px 14px;font-size:.85rem;font-weight:900;margin-top:10px;box-shadow:0 0 20px rgba(245,158,11,0.6);animation:pop 0.5s ease;}

/* ── OPTIONS ─────────────────────── */
.opts-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 10px;}
.opt{padding:14px 10px;border-radius:18px;border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);cursor:pointer;font-family:'Heebo',sans-serif;font-weight:800;font-size:.95rem;text-align:center;transition:all .18s;color:#fff;direction:ltr;}
.opt:hover:not(:disabled){border-color:#a78bfa;background:rgba(167,139,250,.18);transform:scale(1.04);}
.opt.correct{border-color:#10b981!important;background:rgba(16,185,129,.28)!important;animation:pop .3s ease;}
.opt.wrong{border-color:#ef4444!important;background:rgba(239,68,68,.25)!important;animation:shake .4s ease;}
.opt:disabled{cursor:default;}

/* ── MATCH ───────────────────────── */
.match-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 14px;}
.mc{padding:12px 8px;border-radius:16px;border:2px solid rgba(255,255,255,.12);background:rgba(255,255,255,.06);cursor:pointer;font-weight:800;text-align:center;min-height:62px;display:flex;align-items:center;justify-content:center;font-size:.86rem;line-height:1.3;transition:all .18s;color:#fff;}
.mc:hover:not(.dis){border-color:#a78bfa;transform:scale(1.04);}
.mc.sel{border-color:#6366f1;background:rgba(99,102,241,.28);box-shadow:0 0 0 3px rgba(99,102,241,.3);transform:scale(1.06);}
.mc.ok{border-color:#10b981;background:rgba(16,185,129,.2);cursor:default;animation:pop .3s ease;}
.mc.err{border-color:#ef4444;background:rgba(239,68,68,.2);animation:shake .4s ease;}
.mc.dis{opacity:.18;cursor:default;pointer-events:none;}

/* ── BOSS ARENA ──────────────────── */
.arena{padding:24px 14px 16px;position:relative;}
.arena-row{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:10px;position:relative;padding-bottom:18px;border-bottom:2px solid rgba(255,255,255,.08);background:linear-gradient(to top,rgba(255,255,255,.04) 0%,transparent 60%);border-radius:0 0 100px 100px;}
.fighter-box{flex:1;text-align:center;z-index:2;}
.fighter-emoji{font-size:3.5rem;display:inline-block;transition:all .3s;}
.fighter-emoji.hit{animation:hitFlash .35s ease;}
.fighter-emoji.angry{animation:bossAngry 1s ease infinite;}
.fighter-emoji.enraged{animation:bossEnrage .6s ease infinite;filter:drop-shadow(0 0 20px #ef4444);}
.fighter-emoji.dead{animation:bossDeath .9s ease forwards;}
.hp-label{font-size:.7rem;font-weight:700;color:rgba(255,255,255,.5);margin-bottom:4px;}
.hp-bar{height:10px;border-radius:8px;overflow:hidden;margin-bottom:4px;}
.hp-fill{height:100%;border-radius:8px;transition:width .5s cubic-bezier(.34,1.56,.64,1);}
.vs-divider{font-family:'Fredoka One',cursive;font-size:1.1rem;color:rgba(255,255,255,.4);padding:0 4px;flex-shrink:0;padding-bottom:20px;z-index:1;}
.boss-dialogue{background:rgba(0,0,0,.5);border:1px solid rgba(239,68,68,.4);border-radius:14px;padding:10px 14px;font-size:.85rem;font-weight:700;font-style:italic;color:rgba(255,255,255,.9);text-align:center;min-height:36px;transition:all .3s;box-shadow:0 6px 20px rgba(0,0,0,.4);}
.phase-badge{display:inline-flex;align-items:center;gap:4px;border-radius:50px;padding:3px 10px;font-size:.7rem;font-weight:900;margin-bottom:4px;}
.phase-normal{background:rgba(255,255,255,.1);color:rgba(255,255,255,.6);}
.phase-angry{background:rgba(245,158,11,.2);color:#f59e0b;box-shadow:0 0 10px rgba(245,158,11,.4);}
.phase-enraged{background:rgba(239,68,68,.2);color:#ef4444;box-shadow:0 0 14px rgba(239,68,68,.5);animation:pulseRed 1s ease infinite;}
.special-warning{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;animation:specialWarning .5s ease infinite;pointer-events:none;}
.enrage-tint{position:fixed;inset:0;background:rgba(239,68,68,.06);z-index:1;pointer-events:none;animation:pulseRed 1.5s ease infinite;}

/* ── PROGRESS BARS ───────────────── */
.pbar{height:8px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;}
.pfill{height:100%;border-radius:10px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}
.xp-bar{height:5px;background:rgba(255,255,255,.08);border-radius:10px;overflow:hidden;}
.xp-fill{height:100%;background:linear-gradient(90deg,#6366f1,#8b5cf6);border-radius:10px;transition:width .5s ease;}

/* ── CARDS & SECTIONS ────────────── */
.world-card{border-radius:28px;padding:20px;cursor:pointer;transition:all .25s;margin-bottom:14px;position:relative;overflow:hidden;}
.world-card:hover:not(.locked){transform:translateY(-4px);}
.world-card.locked{opacity:.4;filter:grayscale(.8);cursor:not-allowed;}
.char-card{background:rgba(255,255,255,.06);border:2px solid transparent;border-radius:24px;padding:18px;cursor:pointer;transition:all .2s;}
.char-card:hover{transform:translateY(-4px);border-color:var(--c);}
.char-card.picked{border-color:var(--c);background:rgba(255,255,255,.12);box-shadow:0 0 28px var(--cg);}

/* ── RESULT CARD ─────────────────── */
.result-card{background:rgba(255,255,255,.96);color:#1e293b;border-radius:32px;padding:32px 24px;margin:20px 14px;box-shadow:0 24px 64px rgba(0,0,0,.5);}

/* ── STREAK ──────────────────────── */
.streak-badge{display:inline-flex;align-items:center;gap:4px;background:linear-gradient(135deg,#ff6b6b,#f59e0b);border-radius:50px;padding:5px 14px;font-weight:900;font-size:.88rem;}
.streak-fire{animation:streakFire .8s ease infinite;}

/* ── CHEST ───────────────────────── */
.chest-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:20px;text-align:center;}
.chest-emoji{font-size:6.5rem;cursor:pointer;animation:chestBounce 1.5s ease infinite;filter:drop-shadow(0 10px 20px rgba(0,0,0,0.5));}
.chest-emoji.open{animation:pop .4s ease;cursor:default;}
.card-reveal{animation:cardReveal .5s cubic-bezier(.34,1.56,.64,1) both;}

/* ── SHOP ────────────────────────── */
.shop-item{background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.1);border-radius:22px;padding:16px;margin-bottom:10px;display:flex;align-items:center;gap:12px;transition:all .2s;}
.shop-item:hover{border-color:rgba(255,255,255,.3);background:rgba(255,255,255,.1);}

/* ── ACHIEVEMENT POPUP ───────────── */
#ach-popup{position:fixed;top:0;left:50%;transform:translate(-50%,-120%);z-index:9999;background:linear-gradient(135deg,#1e293b,#0f172a);border:2px solid #f59e0b;border-radius:20px;padding:12px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 8px 40px rgba(245,158,11,.5);max-width:340px;width:92%;transition:transform .45s cubic-bezier(.34,1.56,.64,1);}
#ach-popup.show{transform:translate(-50%,10px);}

/* ── MOBILE ──────────────────────── */
@media(max-width:360px){.q-he{font-size:1.45rem;}.opt{font-size:.85rem;}.fighter-emoji{font-size:2.8rem;}.q-emoji{font-size:2.4rem;}}
</style>
</head>
<body>
<div class="app-root" id="app-root">
  <div id="app"></div>
</div>
<div id="ach-popup">
  <span id="ach-icon" style="font-size:2rem;"></span>
  <div><div id="ach-title" class="ff" style="color:#f59e0b;font-size:1rem;"></div>
  <div id="ach-desc" style="font-size:.75rem;color:rgba(255,255,255,.65);font-weight:700;"></div></div>
</div>

const SK="eq_v11_notimerboss";
function defST(){return{charId:null,gems:50,xp:0,lvl:1,xpNext:100,hp:100,maxHp:100,
  potions:{hint:1,shield:0},levels:{},mastery:{},achievements:{},
  totalCorrect:0,comboRecord:0,superUsed:0,goldenHits:0,
  streak:0,lastDate:null};}
let ST=defST();

function loadST(){try{const r=localStorage.getItem(SK);if(r){const p=JSON.parse(r);ST={...defST(),...p,potions:{...defST().potions,...(p.potions||{})},achievements:{...p.achievements}};}}catch(e){}}
function saveST(){try{localStorage.setItem(SK,JSON.stringify(ST));}catch(e){}}
function getLD(id){return ST.levels[id]||{stars:0,done:false};}
function wDone(wId){return WORLDS.find(x=>x.id===wId).levels.every(l=>getLD(l.id).done);}
function wUnlocked(wId){return wId===1||wDone(wId-1);}
function lUnlocked(wId,lId){const w=WORLDS.find(x=>x.id===wId),i=w.levels.findIndex(l=>l.id===lId);return i===0?wUnlocked(wId):getLD(w.levels[i-1].id).done;}
function totalStars(){return Object.values(ST.levels).reduce((s,l)=>s+l.stars,0);}
function getChar(){return CHARS.find(c=>c.id===ST.charId)||CHARS[0];}
function updateStreak(){const today=new Date().toDateString();if(ST.lastDate===today)return;const yesterday=new Date(Date.now()-86400000).toDateString();ST.streak=ST.lastDate===yesterday?ST.streak+1:1;ST.lastDate=today;saveST();}

function shuf(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function randDist(en,n){return shuf(VOCAB.filter(v=>v.en!==en).map(v=>v.en)).slice(0,n);}

function shake(heavy=false){const r=document.getElementById('app-root');r.classList.remove('shake-s','shake-h');void r.offsetWidth;r.classList.add(heavy?'shake-h':'shake-s');}
function hitFighter(id){const e=document.getElementById(id);if(e){e.classList.add('hit');setTimeout(()=>e.classList.remove('hit'),380);}}

function dmgNum(txt,good=true,x,y){
  const d=document.createElement('div');
  d.textContent=txt;
  d.style.cssText=`position:fixed;left:${x||50}%;top:${y||40}%;transform:translateX(-50%);z-index:999;font-family:'Fredoka One',cursive;font-size:${txt.length>4?'1.8rem':'2.2rem'};color:${good?'#10b981':'#ef4444'};pointer-events:none;animation:dmgNum .9s ease forwards;text-shadow:0 3px 12px rgba(0,0,0,.7);`;
  document.body.appendChild(d);setTimeout(()=>d.remove(),950);
}

function shootProjectile(fromId, toId, emoji, isSuper=false) {
  const from = document.getElementById(fromId);
  const to = document.getElementById(toId);
  if(!from || !to) return;
  const fRect = from.getBoundingClientRect();
  const tRect = to.getBoundingClientRect();
  
  const p = document.createElement('div');
  p.textContent = emoji;
  p.style.cssText = `position:fixed;left:${fRect.left+fRect.width/2}px;top:${fRect.top+fRect.height/2}px;font-size:${isSuper?'5rem':'2.5rem'};z-index:999;pointer-events:none;transition:all 0.3s cubic-bezier(0.5,0,0.8,1);transform:translate(-50%,-50%);filter:drop-shadow(0 0 15px ${isSuper?'#f59e0b':'rgba(255,255,255,0.8)'});`;
  document.body.appendChild(p);
  
  setTimeout(()=>{
     const dx = (tRect.left+tRect.width/2) - (fRect.left+fRect.width/2);
     const dy = (tRect.top+tRect.height/2) - (fRect.top+fRect.height/2);
     p.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px)) scale(${isSuper?2:1.5})`;
  }, 20);
  
  setTimeout(()=>{
     p.remove();
     hitFighter(toId);
  }, 320);
}

function flyGems(n){
  const hud=document.getElementById('hud-gems-wrap');if(!hud)return;
  const r=hud.getBoundingClientRect();
  for(let i=0;i<Math.min(n,5);i++){
    const d=document.createElement('div');d.textContent='💎';
    const sx=window.innerWidth/2+(Math.random()-0.5)*100;
    const sy=window.innerHeight*0.45+(Math.random()-0.5)*80;
    d.style.cssText=`position:fixed;left:${sx}px;top:${sy}px;z-index:998;font-size:1.1rem;pointer-events:none;`;
    document.body.appendChild(d);
    const gx=r.left+r.width/2-sx,gy=r.top+r.height/2-sy;
    d.style.setProperty('--gx',gx+'px');d.style.setProperty('--gy',gy+'px');
    setTimeout(()=>{d.style.cssText+=`animation:gemFly .7s ease ${i*.08}s forwards;`;},50);
    setTimeout(()=>d.remove(),900+i*80);
  }
}

function showComboFlash(n){
  if(n!==5&&n!==10&&n!==20)return;
  const d=document.createElement('div');
  d.style.cssText=`position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;pointer-events:none;`;
  const msg=n>=20?'⚡ GODLIKE! ⚡':n>=10?'🌊 MEGA COMBO! 🌊':'🔥 COMBO x5! 🔥';
  const col=n>=20?'linear-gradient(135deg,#8b5cf6,#ec4899,#f59e0b)':n>=10?'linear-gradient(135deg,#06b6d4,#3b82f6)':'linear-gradient(135deg,#f59e0b,#ef4444)';
  d.innerHTML=`<div class="ff" style="font-size:${n>=20?'2.2rem':'1.8rem'};background:${col};-webkit-background-clip:text;-webkit-text-fill-color:transparent;padding:16px 28px;border-radius:20px;background-color:#000;animation:comboFlash .8s ease;text-align:center;line-height:1.2;">${msg}</div>`;
  document.body.appendChild(d);
  if(n>=10)shake(n>=20);
  setTimeout(()=>d.remove(),900);
}

let _achHide=null;
function showAchievement(id){
  const a=ACHIEV.find(x=>x.id===id);if(!a)return;
  const p=document.getElementById('ach-popup');
  document.getElementById('ach-icon').textContent=a.e;
  document.getElementById('ach-title').textContent='🏅 הישג חדש: '+a.t;
  document.getElementById('ach-desc').textContent=a.d;
  p.classList.add('show');if(_achHide)clearTimeout(_achHide);
  _achHide=setTimeout(()=>p.classList.remove('show'),3500);
}
function grantAch(id){if(ST.achievements[id])return;ST.achievements[id]=true;saveST();setTimeout(()=>showAchievement(id),500);}
function checkAch(){
  const done=Object.values(ST.levels).filter(l=>l.done).length;
  if(done>=1)grantAch('first_level');
  if(ST.gems>=500)grantAch('gems500');
  if(ST.comboRecord>=5)grantAch('combo5');
  if(ST.comboRecord>=10)grantAch('combo10');
  if(ST.comboRecord>=20)grantAch('combo20');
  if(ST.goldenHits>=5)grantAch('golden5');
  if(ST.superUsed>=3)grantAch('super3');
  const bossWins=WORLDS.filter(w=>getLD(w.levels[3].id).done).length;
  if(bossWins>=1)grantAch('first_boss');
  if(bossWins>=5)grantAch('all_bosses');
  if(WORLDS.every(w=>w.levels.every(l=>getLD(l.id).stars===3)))grantAch('all_stars');
}

function toast(msg,dur=2000){
  let t=document.getElementById('g-toast');
  if(!t){t=document.createElement('div');t.id='g-toast';t.style.cssText='position:fixed;bottom:70px;left:50%;transform:translateX(-50%);z-index:9990;background:rgba(15,23,42,.95);border:1px solid rgba(255,255,255,.2);color:#fff;padding:10px 20px;border-radius:50px;font-family:Heebo,sans-serif;font-weight:800;font-size:.88rem;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap;max-width:90%;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,0.5);';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._to);t._to=setTimeout(()=>{t.style.opacity='0';},dur);
}

let _spTick=null,_shuffleTick=null;
function clearTimers(){if(_spTick)clearInterval(_spTick);if(_shuffleTick)clearInterval(_shuffleTick);_spTick=_shuffleTick=null;}

function go(screen,...args){
  clearTimers();window.scrollTo(0,0);
  const app=document.getElementById('app');
  if(screen==='chars')app.innerHTML=renderChars();
  else if(screen==='map'){updateStreak();app.innerHTML=renderMap();}
  else if(screen==='world')app.innerHTML=renderWorld(args[0]);
  else if(screen==='shop')app.innerHTML=renderShop();
  else if(screen==='profile')app.innerHTML=renderProfile();
}
function startLevel(wId,lId){clearTimers();window.scrollTo(0,0);initGame(wId,lId);}

function renderWorldCard(w){

      <div style="width:58px;height:58px;border-radius:20px;background:${w.c}18;border:2px solid ${w.c}88;display:flex;align-items:center;justify-content:center;font-size:1.9rem;flex-shrink:0;">${unlocked?w.emoji:'🔒'}</div>
      <div style="flex:1;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;">

        </div>
        <div style="color:rgba(255,255,255,.4);font-size:.74rem;font-weight:700;margin-bottom:7px;">בוס: ${w.bossName} · ${pct}%</div>
        <div class="pbar"><div class="pfill" style="width:${pct}%;background:${w.c};"></div></div>

}

/* ═══════════════════════════════════════
   GAME ENGINE — SHARED STATE
═══════════════════════════════════════ */
let G={};

function initGame(wId,lId){
  const w=WORLDS.find(x=>x.id===wId),l=w.levels.find(x=>x.id===lId);
  const vocab=shuf(VOCAB.filter(v=>v.s===wId));
  const maxH=ST.charId==='leila'?4:3;
  G={wId,lId,l,w,vocab,hearts:maxH,maxH,combo:0,gems:0,correct:0,wrong:0,
     wrongWords:[],shieldOn:false,powerBar:0,superUsed:false,
     isGolden:false,goldenCount:0,
     potions:{...ST.potions}};
  if(l.type==='match')  startMatch();
  else if(l.type==='quiz')  startQuiz();
  else if(l.type==='speed') startSpeed();
  else if(l.type==='boss')  startBoss();
}

/* ── POWER BAR & SUPER ── */
function chargePower(){
  if(G.superUsed)return;
  G.powerBar=Math.min(5,G.powerBar+1);
  updatePowerBar();
}
function updatePowerBar(){
  document.querySelectorAll('.power-seg').forEach((s,i)=>{
    s.classList.toggle('lit',i<G.powerBar);
  });
  const sb=document.getElementById('super-btn');
  if(sb){sb.classList.toggle('ready',G.powerBar>=5);sb.disabled=G.powerBar<5||G.superUsed;}
}
function useSuper(){
  if(G.powerBar<5||G.superUsed)return;
  if(G.l.type==='boss' && (G.bAns || G.bPaused)) return; // Prevent breaking boss transitions
  
  G.superUsed=true;G.powerBar=0;ST.superUsed++;saveST();
  
  // Awesome Flash Effect
  const sf = document.createElement('div');
  sf.className = 'super-flash';
  document.body.appendChild(sf);
  setTimeout(()=>sf.remove(), 1000);
  
  toast('⚡ מכת על! (SUPER!)', 2500);
  shake(true);
  
  if(G.l.type==='boss'){
      G.bAns = true; G.bPaused = true;
      clearTimers(); if(_shuffleTick)clearInterval(_shuffleTick);
      
      const pE = document.getElementById('player-emoji');
      if(pE) { pE.classList.add('pDash'); setTimeout(()=>pE.classList.remove('pDash'), 300); }
      shootProjectile('player-emoji', 'boss-emoji', '⚡', true);
      
      setTimeout(()=>{
          const prevHp = G.bHp;
          G.bHp = Math.max(0, G.bHp - 2); // 2 HP massive damage
          dmgNum('💥 -2 HP (SUPER!)', true, 65, 35);
          
          const fill = document.getElementById('boss-hp-fill');
          if(fill) fill.style.width = (G.bHp/G.bMaxHp*100)+'%';
          
          if(G.bHp <= 0){ killBoss(); return; }
          
          if(!checkPhaseTransitions(prevHp)){
              G.bPaused = false;
              nextBossTurn();
          }
      }, 350);
  } else {
      // Normal mode: auto-reveal correct option
      document.querySelectorAll('.opt').forEach(b=>{
        if(b.dataset.correct==='true'){
            b.style.borderColor='#f59e0b';
            b.style.background='rgba(245,158,11,.25)';
            b.style.boxShadow='0 0 20px rgba(245,158,11,.6)';
        }
      });
  }
  updatePowerBar();checkAch();
}
function renderPowerBar(){
  return `<div class="power-bar-wrap">
    <span style="font-size:.75rem;font-weight:900;color:rgba(255,255,255,.5);">⚡</span>
    <div class="power-segments">${[0,1,2,3,4].map(i=>`<div class="power-seg${i<G.powerBar?' lit':''}"></div>`).join('')}</div>
    <button id="super-btn" class="super-btn${G.powerBar>=5&&!G.superUsed?' ready':''}" onclick="useSuper()" ${G.powerBar<5||G.superUsed?'disabled':''}>SUPER!</button>
  </div>`;
}

/* ── POTION BAR ── */
function renderPotionBar(){
  const p=G.potions;
  return `<div class="potion-bar">
    <button class="pot-btn" onclick="usePotion('hint')" ${!p.hint?'disabled':''}>💡 רמז (${p.hint||0})</button>
    <button class="pot-btn" onclick="usePotion('shield')" ${!p.shield?'disabled':''}>🛡️ מגן (${p.shield||0})</button>
    <button class="pot-btn" style="color:#f59e0b;border-color:rgba(245,158,11,.3);" onclick="go('shop')">🛒</button>
  </div>`;
}
function usePotion(type){
  if(type==='hint'){
    if(!G.potions.hint){toast('אין רמזים!');return;}
    G.potions.hint--;
    const wrongs=[...document.querySelectorAll('.opt')].filter(b=>b.dataset.correct!=='true'&&!b.disabled);
    shuf(wrongs).slice(0,2).forEach(b=>{b.disabled=true;b.style.opacity='.15';});
    toast('💡 שני אפשרויות הוסרו!');
  } else if(type==='shield'){
    if(!G.potions.shield){toast('אין מגן!');return;}
    G.potions.shield--;G.shieldOn=true;toast('🛡️ מגן הופעל!');
  }
  ST.potions={...G.potions};saveST();
  document.querySelectorAll('.pot-btn').forEach((b,i)=>{
    if(i===0){b.textContent=`💡 רמז (${G.potions.hint||0})`;b.disabled=!G.potions.hint;}
    if(i===1){b.textContent=`🛡️ מגן (${G.potions.shield||0})`;b.disabled=!G.potions.shield;}
  });
}

/* ── HUD ── */
function renderHUD(title,color){
  const hArr=Array.from({length:G.maxH},(_,i)=>i<G.hearts?'❤️':'🖤');
  const cClass=G.combo>=20?'combo-10':G.combo>=10?'combo-10':G.combo>=5?'combo-5':G.combo>=2?'combo-2':'';
  return `<div class="hud">
    <button class="btn-back" onclick="go('world',${G.wId})">←</button>
    <div style="flex:1;">
      <div style="font-size:.75rem;font-weight:800;color:${color};">${title}</div>
      <div style="display:flex;gap:2px;margin-top:1px;">${hArr.map((h,i)=>`<span class="heart${i>=G.hearts?' lost':''}">${h}</span>`).join('')}</div>
    </div>
    ${G.combo>=2?`<div class="combo-badge ${cClass}">🔥 x${G.combo>=20?4:G.combo>=10?3:G.combo>=5?2:2} combo</div>`:''}
    <div id="hud-gems-wrap" class="gems-hud">💎 <span id="hud-gems">${ST.gems}</span></div>
  </div>`;
}

/* ── SHARED CORRECT/WRONG ── */
function onCorrect(word){
  G.combo++;G.correct++;ST.totalCorrect++;
  if(G.combo>ST.comboRecord)ST.comboRecord=G.combo;
  const base=G.isGolden?50:10;
  const mult=G.combo>=10?4:G.combo>=5?3:G.combo>=3?2:1;
  const earned=base*mult;
  G.gems+=earned;addGems(earned);addXP(15);
  if(word){const k=`${word.s}_${word.en}`;ST.mastery[k]=Math.min(3,(ST.mastery[k]||0)+1);saveST();}
  if(G.isGolden){G.goldenCount++;ST.goldenHits++;saveST();}
  G.isGolden=false;
  chargePower();
  flyGems(G.combo>=5?5:2);
  showComboFlash(G.combo);
  checkAch();updateHUD();
}
function onWrong(word){
  G.isGolden=false;
  if(G.shieldOn){G.shieldOn=false;toast('🛡️ מגן ספג טעות!');return;}
  const prev=G.combo;
  G.combo=0;G.wrong++;
  G.hearts=Math.max(0,G.hearts-1);
  if(word)G.wrongWords.push(word);
  if(word){const k=`${word.s}_${word.en}`;if(!(k in ST.mastery))ST.mastery[k]=0;saveST();}
  shake(G.hearts===0);
  updateHUD();
  if(G.hearts<=0)setTimeout(()=>showFailed(),400);
}

/* ═══════════════════════════════════════
   MATCH
═══════════════════════════════════════ */
function startMatch(){
  G.allPairs=shuf([...G.vocab]);G.mRound=0;G.mPPC=4;G.mMatched=new Set();G.mSel=null;G.mCards=[];
  nextMatchRound();
}
function nextMatchRound(){
  const sl=G.allPairs.slice(G.mRound*G.mPPC,(G.mRound+1)*G.mPPC);
  if(!sl.length){finishLevel();return;}
  const he=sl.map((w,i)=>({id:`h${i}`,txt:w.e+' '+w.he,pid:i,lang:'he',w}));
  const en=sl.map((w,i)=>({id:`e${i}`,txt:w.en,pid:i,lang:'en',w}));
  G.mCards=shuf([...he,...en]);G.mMatched=new Set();G.mSel=null;
  renderMatch();
}
function renderMatch(){
  const rounds=Math.ceil(G.allPairs.length/G.mPPC);
  document.getElementById('app').innerHTML=`<div class="screen" style="background:radial-gradient(ellipse at 50% 0%,${G.w.c}18 0%,#08081a 50%);min-height:100vh;">
    ${renderHUD(`🔗 חיבורים · סבב ${G.mRound+1}/${rounds}`,G.w.c)}
    ${renderPotionBar()}
    ${renderPowerBar()}
    <p style="text-align:center;color:rgba(255,255,255,.4);font-size:.78rem;font-weight:700;padding:8px 0 2px;">חבר/י זוג: עברית ↔ אנגלית</p>
    <div class="match-grid">
      ${G.mCards.map(c=>{const ok=G.mMatched.has(c.pid),sel=G.mSel&&G.mSel.id===c.id;
        return `<div class="mc${ok?' ok dis':sel?' sel':''}" id="mc_${c.id}" style="${c.lang==='en'?'direction:ltr;':''}" onclick="mClick('${c.id}')">${c.txt}</div>`;}).join('')}
    </div>
  </div>`;
}
function mClick(id){
  const card=G.mCards.find(c=>c.id===id);if(!card||G.mMatched.has(card.pid))return;
  if(!G.mSel){G.mSel=card;renderMatch();return;}
  if(G.mSel.id===id){G.mSel=null;renderMatch();return;}
  const prev=G.mSel;G.mSel=null;
  if(prev.pid===card.pid&&prev.lang!==card.lang){
    G.mMatched.add(card.pid);onCorrect(card.w);
    ['mc_'+prev.id,'mc_'+card.id].forEach(eid=>{const e=document.getElementById(eid);if(e){e.className='mc ok dis';e.classList.add('anim-pop');}});
    const sl=G.allPairs.slice(G.mRound*G.mPPC,(G.mRound+1)*G.mPPC);
    if(G.mMatched.size>=sl.length)setTimeout(()=>{confetti({particleCount:60,spread:60,origin:{y:.65}});G.mRound++;nextMatchRound();},700);
  } else {
    onWrong(card.w);
    ['mc_'+prev.id,'mc_'+card.id].forEach(eid=>{const e=document.getElementById(eid);if(e){e.classList.add('err');setTimeout(()=>e.classList.remove('err'),450);}});
    if(G.hearts>0)setTimeout(()=>{G.mSel=null;renderMatch();},480);
  }
}

/* ═══════════════════════════════════════
   QUIZ
═══════════════════════════════════════ */
function startQuiz(){G.qQueue=shuf([...G.vocab]);G.qCur=0;G.qAns=false;renderQuiz();}
function renderQuiz(){
  if(G.qCur>=G.qQueue.length){finishLevel();return;}
  const w=G.qQueue[G.qCur],prog=G.qCur/G.qQueue.length*100;
  G.isGolden=Math.random()<0.08;
  const opts=shuf([w.en,...randDist(w.en,3)]);
  document.getElementById('app').innerHTML=`<div class="screen" style="background:radial-gradient(ellipse at 50% 0%,${G.w.c}18 0%,#08081a 50%);min-height:100vh;">
    ${renderHUD(`🧠 חידון · ${G.qCur+1}/${G.qQueue.length}`,G.w.c)}
    ${renderPotionBar()}
    ${renderPowerBar()}
    <div class="pbar" style="margin:6px 14px;"><div class="pfill" style="width:${prog}%;background:${G.w.c};"></div></div>
    <div class="q-card${G.isGolden?' golden':''}">
      <div class="q-emoji">${w.e}</div>
      <div class="q-he">${w.he}</div>
      ${G.isGolden?`<div class="gold-badge">✨ מילת זהב! x5 💎</div>`:''}
    </div>
    <div class="opts-grid" id="opts-wrap">
      ${opts.map(o=>`<button class="opt" dir="ltr" data-correct="${o===w.en}" onclick="checkQuiz('${o.replace(/'/g,"\\'")}','${w.en.replace(/'/g,"\\'")}',${G.qCur})">${o}</button>`).join('')}
    </div>
  </div>`;
}
function checkQuiz(chosen,correct,idx){
  if(G.qAns)return;G.qAns=true;
  document.querySelectorAll('.opt').forEach(b=>{
    b.disabled=true;
    if(b.textContent.trim()===correct)b.classList.add('correct');
    else if(b.textContent.trim()===chosen&&chosen!==correct)b.classList.add('wrong');
  });
  if(chosen===correct){onCorrect(G.qQueue[idx]);dmgNum(G.isGolden?'+50 ✨':'+'+( G.combo>=5?30:G.combo>=3?20:10)+'💎',true);}
  else{onWrong(G.qQueue[idx]);dmgNum('✗',false);}
  if(G.hearts>0)setTimeout(()=>{G.qCur++;G.qAns=false;renderQuiz();},950);
}

/* ═══════════════════════════════════════
   SPEED
═══════════════════════════════════════ */
function startSpeed(){
  G.spWords=shuf([...G.vocab]);G.spCur=0;G.spAns=false;
  // Increased time for Speed Mode
  G.spTime=ST.charId==='dana'?63:60; G.spCorrect=0;
  renderSpeed();
  _spTick=setInterval(()=>{
    G.spTime--;
    const el=document.getElementById('sp-t');if(el)el.textContent=G.spTime;
    const tc=G.spTime>20?'#26de81':G.spTime>10?'#f7b731':'#ef4444';
    if(el)el.style.color=tc;
    const bf=document.getElementById('sp-bar');if(bf){bf.style.width=(G.spTime/(ST.charId==='dana'?63:60)*100)+'%';bf.style.background=tc;}
    if(G.spTime<=0){clearInterval(_spTick);_spTick=null;finishLevel();}
  },1000);
}
function renderSpeed(){
  if(G.spCur>=G.spWords.length){G.spWords=shuf([...G.vocab]);G.spCur=0;}
  const w=G.spWords[G.spCur],tot=ST.charId==='dana'?63:60;
  const tc=G.spTime>20?'#26de81':G.spTime>10?'#f7b731':'#ef4444';
  G.isGolden=Math.random()<0.06;
  const opts=shuf([w.en,...randDist(w.en,3)]);
  document.getElementById('app').innerHTML=`<div class="screen" style="background:radial-gradient(ellipse at 50% 0%,#1a0a00 0%,#08081a 50%);min-height:100vh;">
    ${renderHUD(`⚡ מהירות · ✅ ${G.spCorrect}`,G.w.c)}
    ${renderPowerBar()}
    <div style="padding:8px 14px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;">
        <div class="ff" id="sp-t" style="font-size:2.2rem;color:${tc};">${G.spTime}</div>
        ${G.isGolden?`<div class="gold-badge">✨ מילת זהב!</div>`:''}
        <div class="ff" style="font-size:1.1rem;color:rgba(255,255,255,.6);">🎯 ${G.spCorrect}</div>
      </div>
      <div style="height:10px;background:rgba(255,255,255,.1);border-radius:10px;overflow:hidden;">
        <div id="sp-bar" style="height:100%;width:${G.spTime/tot*100}%;background:${tc};border-radius:10px;transition:width .9s linear;"></div>
      </div>
    </div>
    <div class="q-card${G.isGolden?' golden':''}">
      <div class="q-emoji">${w.e}</div>
      <div class="q-he">${w.he}</div>
    </div>
    <div class="opts-grid">
      ${opts.map(o=>`<button class="opt" dir="ltr" data-correct="${o===w.en}" onclick="checkSpeed('${o.replace(/'/g,"\\'")}','${w.en.replace(/'/g,"\\'")}',${G.spCur})">${o}</button>`).join('')}
    </div>
  </div>`;
}
function checkSpeed(chosen,correct,idx){
  if(G.spAns)return;G.spAns=true;
  const w=G.spWords[G.spCur%G.spWords.length];
  if(chosen===correct){G.spCorrect++;onCorrect(w);dmgNum('+💎',true);}
  else{onWrong(w);}
  if(G.hearts>0&&G.spTime>0)setTimeout(()=>{G.spCur++;G.spAns=false;renderSpeed();},420);
  if(G.spCorrect>=10)grantAch('speed10');
}

/* ═══════════════════════════════════════
   BOSS BATTLE (NO TIMER)
═══════════════════════════════════════ */
function getBossPhase(){const r=G.bHp/G.bMaxHp;return r>.66?'normal':r>.33?'angry':'enraged';}
function getBossTaunt(){const phase=getBossPhase(),pool=G.w.taunts[phase];return pool[Math.floor(Math.random()*pool.length)];}

function startBoss(){
  G.bHp=G.w.bossHp;G.bMaxHp=G.w.bossHp;
  G.bQueue=shuf([...G.vocab]);G.bCur=0;G.bAns=false;G.bPaused=false;
  G.bSpecial=false;G.bSpecialTurns=0;G.bHitSpecial=false;
  G.bTaunt=getBossTaunt();
  renderBoss();
}

function renderBoss(){
  if(G.bHp<=0){clearTimers();showChestOpening();return;}
  const w=G.bQueue[G.bCur%G.bQueue.length];
  G.isGolden=Math.random()<0.07;
  const opts=shuf([w.en,...randDist(w.en,3)]);
  const phase=getBossPhase();
  const hpPct=G.bHp/G.bMaxHp*100;
  const ch=getChar();
  const phaseBadge=phase==='enraged'?`<div class="phase-badge phase-enraged">💀 ENRAGED</div>`:phase==='angry'?`<div class="phase-badge phase-angry">⚠️ ANGRY</div>`:`<div class="phase-badge phase-normal">● normal</div>`;
  
  document.getElementById('app').innerHTML=`
    <div class="screen" style="background:radial-gradient(ellipse at 50% 20%,${phase==='enraged'?'#2a0505':phase==='angry'?'#1a0d00':'#0a0a1a'} 0%,#08081a 70%);min-height:100vh;">
      ${phase==='enraged'?`<div class="enrage-tint"></div>`:''}
      ${renderHUD(`👹 ${G.w.bossName}`,G.w.c)}
      ${renderPowerBar()}
      <div class="arena">
        <div class="arena-row">
          <div class="fighter-box">
            <div class="hp-label">❤️ שחקן</div>
            <div class="hp-bar" style="background:rgba(255,255,255,.1);">
              <div class="hp-fill" style="width:${G.hearts/G.maxH*100}%;background:linear-gradient(90deg,#ef4444,#f97316);"></div>
            </div>
            <img src="${ch.av}" class="fighter-emoji" id="player-emoji" style="width:75px;height:75px;border-radius:50%;border:3px solid ${ch.c};object-fit:cover;animation:float 2.5s ease infinite;box-shadow:0 0 20px ${ch.cg};" onerror="this.style.fontSize='3.5rem';this.style.textAlign='center';this.textContent='${ch.e}';this.style.border='none';this.style.background='transparent';">
            <div class="ff" style="font-size:.82rem;color:${ch.c};margin-top:6px;">${ch.name}</div>
          </div>
          <div class="vs-divider">VS</div>
          <div class="fighter-box">
            <div class="hp-label">💀 בוס</div>
            <div class="hp-bar">
              <div class="hp-fill" id="boss-hp-fill" style="width:${hpPct}%;background:linear-gradient(90deg,#ef4444,#f59e0b);"></div>
            </div>
            <div class="fighter-emoji ${phase==='enraged'?'enraged':phase==='angry'?'angry':''}" id="boss-emoji">${G.w.bossE}</div>
            ${phaseBadge}
          </div>
        </div>
        <div class="boss-dialogue" id="boss-dialogue">"${G.bTaunt}"</div>
      </div>
      
      <div style="text-align:center; height:20px; margin-bottom:10px;">
          ${G.bSpecial?`<div style="color:#ef4444;font-size:.85rem;font-weight:900;animation:pulseRed 1s ease infinite;">⚠️ התשובות מעורבבות! קראי היטב!</div>`:''}
      </div>

      <div class="q-card${G.isGolden?' golden':''}">
        <div class="q-emoji" style="font-size:2.5rem;">${w.e}</div>
        <div class="q-he" style="font-size:1.5rem;">${w.he}</div>
        ${G.isGolden?`<div class="gold-badge">✨ מילת זהב! x5 💎</div>`:''}
      </div>
      <div class="opts-grid">
        ${opts.map(o=>`<button class="opt" dir="ltr" data-correct="${o===w.en}" onclick="checkBoss('${o.replace(/'/g,"\\'")}','${w.en.replace(/'/g,"\\'")}',${G.bCur})">${o}</button>`).join('')}
      </div>
      ${renderPotionBar()}
    </div>`;
    
  if(G.bSpecial&&G.bSpecialTurns>0){
    if(_shuffleTick)clearInterval(_shuffleTick);
    _shuffleTick=setInterval(()=>{
      const grid=document.querySelector('.opts-grid');
      if(!grid)return;
      const btns=[...grid.children];
      shuf(btns).forEach(b=>grid.appendChild(b));
    },1400);
  }
}

function checkBoss(chosen,correct,idx){
  if(G.bAns||G.bPaused)return; G.bAns=true;
  clearTimers(); if(_shuffleTick)clearInterval(_shuffleTick);
  const w=G.bQueue[G.bCur%G.bQueue.length];
  
  if(chosen===correct){
    const pE = document.getElementById('player-emoji');
    if(pE) { pE.classList.add('pDash'); setTimeout(()=>pE.classList.remove('pDash'), 300); }
    
    shootProjectile('player-emoji', 'boss-emoji', '✨');
    
    setTimeout(() => {
        const prevHp=G.bHp;G.bHp=Math.max(0,G.bHp-1);
        onCorrect(w);
        dmgNum(`💥 -1 HP`,true,65,35);
        const fill=document.getElementById('boss-hp-fill');
        if(fill)fill.style.width=(G.bHp/G.bMaxHp*100)+'%';
        
        if(G.bHp<=0){ killBoss(); return; }
        if(!checkPhaseTransitions(prevHp)){
            nextBossTurn();
        }
    }, 350);
  } else {
    const bE = document.getElementById('boss-emoji');
    if(bE) { bE.classList.add('bDash'); setTimeout(()=>bE.classList.remove('bDash'), 300); }
    
    shootProjectile('boss-emoji', 'player-emoji', '🔥');
    
    setTimeout(() => {
        onWrong(w);
        dmgNum('😵',false,35,35);
        G.bTaunt=getBossTaunt();
        const dlg=document.getElementById('boss-dialogue');if(dlg)dlg.textContent=`"${G.bTaunt}"`;
        if(G.hearts<=0) return;
        nextBossTurn();
    }, 350);
  }
}

function nextBossTurn() {
  G.bCur++; G.bAns=false; G.bTaunt=getBossTaunt();
  setTimeout(()=>{ if(!G.bPaused){renderBoss();} }, 780);
}

function checkPhaseTransitions(prevHp) {
  const oldPhase = getBossPhaseFrom(prevHp);
  const newPhase = getBossPhaseFrom(G.bHp);
  
  if(!G.bHitSpecial && prevHp>Math.floor(G.bMaxHp/2) && G.bHp<=Math.floor(G.bMaxHp/2)){
     G.bHitSpecial=true; triggerBossSpecial(); return true; 
  }
  
  if(oldPhase !== newPhase) {
      triggerBossPhaseChange(newPhase);
      return true;
  }
  return false;
}

function getBossPhaseFrom(hp) {
   const r = hp/G.bMaxHp;
   return r>0.66 ? 'normal' : r>0.33 ? 'angry' : 'enraged';
}

function killBoss() {
  const be=document.getElementById('boss-emoji');if(be)be.classList.add('dead');
  confetti({particleCount:150,spread:100,origin:{y:.5},colors:['#ff6b6b','#f59e0b','#a55eea']});
  setTimeout(()=>showChestOpening(),900);
}

function triggerBossSpecial(){
  G.bPaused = true;
  G.bSpecial=true;G.bSpecialTurns=3;
  const d=document.createElement('div');d.className='special-warning';
  d.innerHTML=`<div class="ff" style="font-size:2.2rem;color:#ef4444;text-shadow:0 0 30px #ef4444;background:rgba(0,0,0,.9);padding:24px 32px;border-radius:24px;border:3px solid #ef4444;text-align:center;">⚠️ DARK MAGIC! ⚠️<br><span style="font-size:1.1rem;font-weight:700;">התשובות עומדות להתערבב!</span></div>`;
  document.body.appendChild(d);shake(true);
  toast('👹 הבוס מפעיל כוח חשוך! התשובות מתערבבות!',2500);
  
  setTimeout(()=>{
     d.remove();
     G.bPaused = false;
     nextBossTurn();
  }, 2500);
}

function triggerBossPhaseChange(phase){
  G.bPaused = true;
  const msg = phase === 'enraged' ? '🔥 ENRAGED!!! 🔥' : '💢 ANGRY! 💢';
  const col = phase === 'enraged' ? '#ef4444' : '#f59e0b';
  const d = document.createElement('div');
  d.style.cssText = `position:fixed;inset:0;z-index:900;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,0.85);backdrop-filter:blur(8px);animation:fadeUp 0.3s ease;`;
  d.innerHTML = `<div class="ff" style="font-size:3.5rem;color:${col};text-shadow:0 0 40px ${col};animation:pop 0.5s ease infinite;">${msg}</div>`;
  document.body.appendChild(d);
  shake(true);
  
  setTimeout(()=>{
     d.remove();
     G.bPaused = false;
     nextBossTurn();
  }, 2000);
}

function finishLevel(){
  clearTimers();
  const stars=G.hearts>=G.maxH?3:G.hearts>=2?2:G.hearts>=1?1:1;
  const old=getLD(G.lId);ST.levels[G.lId]={stars:Math.max(old.stars,stars),done:true};
  ST.potions={...G.potions};
  if(G.l.type==='quiz'&&G.wrong===0)grantAch('perfect');
  if(G.l.type==='speed'&&G.spCorrect>=10)grantAch('speed10');
  if(ST.charId==='maya'&&G.l.type==='boss'){ST.hp=Math.min(ST.maxHp,ST.hp+20);saveST();}

  if(WORLDS.every(w=>w.levels.every(l=>getLD(l.id).done)))confetti({particleCount:200,spread:120,origin:{y:.4}});

}

  const done=Object.values(ST.levels).filter(l=>l.done).length;
  const bossWins=WORLDS.filter(w=>getLD(w.levels[3].id).done).length;
  return `<div class="screen" style="background:radial-gradient(ellipse at 50% 0%,${ch.c}18 0%,#08081a 55%);min-height:100vh;padding-bottom:32px;">
    <div style="display:flex;align-items:center;gap:12px;padding:14px;background:rgba(0,0,0,.5);border-bottom:1px solid rgba(255,255,255,.07);">
      <button class="btn-back" onclick="go('map')">←</button>
      <h1 class="ff" style="font-size:1.6rem;">🏅 פרופיל</h1>
    </div>
    <div style="padding:18px 14px 0;">
      <div style="background:linear-gradient(135deg,${ch.c}22,${ch.c}08);border:1.5px solid ${ch.c}44;border-radius:28px;padding:22px;text-align:center;margin-bottom:14px;">
        <img src="${ch.av}" style="width:68px;height:68px;border-radius:50%;border:3px solid ${ch.c};background:rgba(255,255,255,.08);margin-bottom:10px;object-fit:cover;">
        <div class="ff" style="font-size:1.6rem;color:${ch.c};">${ch.name}</div>
        <div style="color:rgba(255,255,255,.45);font-size:.82rem;font-weight:700;margin-bottom:12px;">${ch.role} · רמה ${ST.lvl}</div>
        <div class="xp-bar" style="height:10px;"><div class="xp-fill" style="width:${ST.xp/ST.xpNext*100}%;"></div></div>
        <div style="color:rgba(255,255,255,.35);font-size:.73rem;font-weight:700;margin-top:4px;">${ST.xp}/${ST.xpNext} XP לרמה הבאה</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;">
        ${[['💎',ST.gems,'יהלומים'],['⭐',totalStars(),'כוכבים'],['✅',ST.totalCorrect,'נכון'],['🔥',ST.comboRecord,'שיא קומבו'],['🗺️',done,'שלבים'],['👹',bossWins,'בוסים']].map(([e,v,t])=>`<div style="background:rgba(255,255,255,.06);border-radius:16px;padding:12px;text-align:center;"><div style="font-size:1.4rem;">${e}</div><div class="ff" style="font-size:1.3rem;">${v}</div><div style="color:rgba(255,255,255,.38);font-size:.68rem;font-weight:700;">${t}</div></div>`).join('')}
      </div>
      <div class="ff" style="margin-bottom:10px;">🏅 הישגים (${Object.keys(ST.achievements).length}/${ACHIEV.length})</div>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:20px;">
        ${ACHIEV.map(a=>{const got=ST.achievements[a.id];return `<div style="background:${got?'rgba(245,158,11,.15)':'rgba(255,255,255,.04)'};border:1.5px solid ${got?'rgba(245,158,11,.5)':'rgba(255,255,255,.07)'};border-radius:14px;padding:10px 6px;text-align:center;${!got?'filter:grayscale(1);opacity:.35':''}">
          <div style="font-size:1.4rem;">${a.e}</div>
          <div style="font-size:.66rem;font-weight:800;color:${got?'#f59e0b':'rgba(255,255,255,.4)'};margin-top:3px;line-height:1.2;">${a.t}</div>
        </div>`;}).join('')}
      </div>
      <button class="btn btn-ghost" style="width:100%;" onclick="if(confirm('לאפס הכל?')){localStorage.removeItem('${SK}');ST=defST();go('chars');}">🔄 אפס משחק</button>
    </div>
  </div>`;
}

/* ═══════════════════════════════════════
   INIT
═══════════════════════════════════════ */
loadST();updateStreak();
go(!ST.charId?'chars':'map');
</script>
</body>
</html>
